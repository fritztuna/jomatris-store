<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart | Jomatris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <!-- keep your existing navbar EXACTLY the same -->
</header>

<main class="cart-page">

  <h1>Your Cart</h1>

  <div class="cart-container">

    <div class="cart-items" id="cartItems">
      <!-- items injected by JS -->
    </div>

    <div class="cart-summary">
      <h2>Order Summary</h2>
      <p>Total Items: <span id="itemCount">0</span></p>
      <p class="total">Total: N$ <span id="cartTotal">0</span></p>

      <button class="checkout-btn">Proceed to Checkout</button>
    </div>

  </div>

</main>

<script src="cart.js"></script>
</body>
</html>

<style>

.cart-page {
  padding: 80px 10%;
  color: #fff;
}

.cart-page h1 {
  margin-bottom: 30px;
  font-size: 2rem;
}

.cart-container {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 40px;
}

.cart-items {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.cart-item {
  display: flex;
  gap: 20px;
  background: linear-gradient(180deg,#111,#0b0b0b);
  padding: 22px;
  border-radius: 14px;
  align-items: center;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.cart-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rbga(0,0,0,0.4);
}

.cart-item img {
  width: 90px;
  height: 110px;
  object-fit: contain;
  background: #000;
  padding: 6px;
  border-radius: 10px;
}

.cart-item-info {
  flex: 1;
}

.cart-item-info h3 {
  margin: 0 0 6px;
  font-size: 1.05rem;
  font-weight: 500;
}

.cart-item-info p {
  margin: 2px 0;
  font-size: 0.9rem;  
  opacity: 0.8;
}

.cart-item-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.cart-item-actions button {
  background: #000;
  border: 1px solid #333;
  color: #fff;
  padding: 6px 12px;
  cursor: pointer;
  border-radius: 6px;
  font-size: 0.85rem;
  transition: background 0.2s ease, border 0.2s ease;
}

.cart-item-actions button:hover {
    background: #111;
    border: #555;
}

.cart-summary {
  position: sticky;
  top: 120px;  
  background: #111;
  padding: 25px;
  border-radius: 10px;
  height: fit-content;
}

.cart-summary h2 {
  margin-bottom: 20px;
}

.cart-summary .total {
  font-size: 1.3rem;
  margin: 15px 0;
}

.checkout-btn {
  width: 100%;
  padding: 14px;
  background: #fff;
  color: #000;
  font-weight: 600;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.checkout-btn:hover {
  transform: translateY(-1px);
  opacity: 0.2s ease;
}

</style>

<script>

const cartItemsContainer = document.getElementById('cartItems');
const itemCountEl = document.getElementById('itemCount');
const cartTotalEl = document.getElementById('cartTotal');

let cart = JSON.parse(localStorage.getItem('cart')) || [];

function renderCart() {
  cartItemsContainer.innerHTML = '';

  if (cart.length === 0) {
    cartItemsContainer.innerHTML =  `<p>Your cart is empty.</p> `
    itemCountEl.innerText = 0;
    cartTotalEl.innerText = 0;
    return;
  }

  let total = 0;
  let count = 0;

  cart.forEach(item => {
    total += item.price * item.qty;
    count += item.qty;

    const div = document.createElement('div');
    div.className = 'cart-item';

    div.innerHTML = `
      <img src="${item.image}">
      <div class="cart-item-info">
        <h3>${item.name}</h3>
        <p>N$ ${item.price}</p>
        <p>Qty: ${item.qty}</p>
      </div>
      <div class="cart-item-actions">
        <button onclick="increaseQty('${item.id}')">+</button>
        <button onclick="decreaseQty('${item.id}')">−</button>
        <button onclick="removeItem('${item.id}')">Remove</button>
      </div>
    `;

    cartItemsContainer.appendChild(div);
  });

  itemCountEl.innerText = count;
  cartTotalEl.innerText = total;
}

function saveCart() {
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

function increaseQty(id) {
  cart.find(item => item.id === id).qty++;
  saveCart();
}

function decreaseQty(id) {
  const item = cart.find(item => item.id === id);
  if (item.qty > 1) item.qty--;
  saveCart();
}

function removeItem(id) {
  cart = cart.filter(item => item.id !== id);
  saveCart();
}

renderCart();

</script>

</body>
</html>

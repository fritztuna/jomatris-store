<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order | Jomatris</title>
<link rel="icon" type="image/png" href="images/favicon/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#0a0a0a;color:#fff;min-height:100vh;}
.navbar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;border-bottom:1px solid #141414;}
.logo img{width:120px;height:100px;object-fit:contain;}
.back-link{color:#666;text-decoration:none;font-size:0.78rem;letter-spacing:1px;display:flex;align-items:center;gap:6px;}
.back-link:hover{color:#fff;}
.wrap{max-width:480px;margin:0 auto;padding:56px 24px 100px;}
h1{font-size:1.4rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;text-align:center;}
.subtitle{text-align:center;color:#666;font-size:0.82rem;margin-bottom:32px;}
label{display:block;font-size:0.68rem;letter-spacing:1px;text-transform:uppercase;color:#555;margin-bottom:6px;}
input{width:100%;background:#111;border:1px solid #1e1e1e;color:#eee;padding:12px 14px;font-size:0.85rem;border-radius:8px;outline:none;font-family:'Poppins',sans-serif;margin-bottom:16px;}
.submit-btn{width:100%;padding:14px;background:#fff;color:#000;font-weight:700;font-size:0.78rem;letter-spacing:1.5px;text-transform:uppercase;border:none;border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;}
.submit-btn:disabled{background:#1a1a1a;color:#444;cursor:not-allowed;}
.error-box{background:#2a1414;border:1px solid #4a1e1e;color:#e88;padding:10px 14px;border-radius:8px;font-size:0.78rem;margin-bottom:16px;display:none;}
.result{margin-top:28px;background:#0f0f0f;border:1px solid #1a1a1a;border-radius:12px;padding:22px;display:none;}
.result .ref{font-size:0.8rem;color:#888;margin-bottom:14px;}
.status-badge{display:inline-block;padding:6px 14px;border-radius:999px;font-size:0.72rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;}
.status-paid{background:#123a1e;color:#4caf50;}
.status-pending{background:#1e1e10;color:#e0b93a;}
.status-failed{background:#3a1414;color:#e05555;}
.result-row{display:flex;justify-content:space-between;font-size:0.82rem;color:#ccc;padding:8px 0;border-top:1px solid #1a1a1a;}
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html"><div class="logo"><img src="images/j-logo.png" alt="Jomatris"></div></a>
  <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> Back to Shop</a>
</nav>

<div class="wrap">
  <h1>Track Your Order</h1>
  <p class="subtitle">Enter your order reference and the email you used at checkout.</p>
  <div class="error-box" id="errorBox"></div>

  <form id="trackForm">
    <label>Order Reference</label>
    <input type="text" id="refInput" placeholder="JMTS-XXXXXXXX" required>
    <label>Email</label>
    <input type="email" id="emailInput" required>
    <button type="submit" class="submit-btn" id="submitBtn">Track Order</button>
  </form>

  <div class="result" id="result"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('trackForm');
  const errorBox = document.getElementById('errorBox');
  const result = document.getElementById('result');
  const submitBtn = document.getElementById('submitBtn');

  const statusMeta = {
    paid: { label: 'Paid', cls: 'status-paid' },
    pending: { label: 'Pending Payment', cls: 'status-pending' },
    failed: { label: 'Payment Failed', cls: 'status-failed' },
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    result.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Searching…';

    try {
      const res = await fetch('/api/checkout/track', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          reference: document.getElementById('refInput').value.trim(),
          email: document.getElementById('emailInput').value.trim(),
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorBox.textContent = data.error || 'Order not found.';
        errorBox.style.display = 'block';
        return;
      }

      const order = data.order;
      const meta = statusMeta[order.paymentStatus] || statusMeta.pending;
      result.innerHTML = `
        <div class="ref">Order ${order.reference}</div>
        <span class="status-badge ${meta.cls}">${meta.label}</span>
        ${order.items.map(i => `<div class="result-row"><span>${i.name}${i.size ? ' (' + i.size + ')' : ''} × ${i.qty}</span><span>N$${(i.price * i.qty).toFixed(2)}</span></div>`).join('')}
        <div class="result-row" style="font-weight:700;color:#fff;"><span>Total</span><span>N$${order.total.toFixed(2)}</span></div>
        <div class="result-row"><span>Payment Method</span><span>${order.paymentMethod.toUpperCase()}</span></div>
        <div class="result-row"><span>Delivery</span><span>${order.customer.deliveryMethod === 'pickup' ? 'Store Pickup' : 'Home Delivery'}</span></div>
      `;
      result.style.display = 'block';
    } catch {
      errorBox.textContent = 'Could not reach the server. Please try again.';
      errorBox.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Track Order';
    }
  });

  lucide.createIcons();
});
</script>
</body>
</html>
